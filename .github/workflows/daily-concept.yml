name: Publish daily backend concept

on:
  schedule:
    # Every day at 09:17 Shanghai time
    - cron: "17 9 * * *"
      timezone: "Asia/Shanghai"

  # Allows manual testing from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-backend-concept
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Publish today's concept
        run: python daily_concept.py

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"

          git add DAILY_CONCEPTS.md

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "docs: publish daily backend concept"
          git push
